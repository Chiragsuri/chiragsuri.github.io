<button id="scrollTopBtn" title="Back to top">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scrollBtn = document.getElementById("scrollTopBtn");

    if (scrollBtn) {
      window.addEventListener("scroll", () => {
        if (window.scrollY > 400) {
          scrollBtn.classList.add("visible");
        } else {
          scrollBtn.classList.remove("visible");
        }
      });

      scrollBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function () {
    emailjs.init("ekc09s12Vt5OB3CO-");
  })();

  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("contact-form");
    const toast = document.getElementById("form-toast");

    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;

        // Lock button and show spinner
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

        // SAFETY FALLBACK: Force unlock after 8 seconds if network hangs
        const safetyTimer = setTimeout(() => {
          if (submitBtn.disabled) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
            showToast("Network timeout. Please try again.", "error");
          }
        }, 8000);

        try {
          emailjs.sendForm("service_mghxt4s", "template_sqrqdgr", form).then(
            function () {
              clearTimeout(safetyTimer);
              showToast("Message sent successfully! ✅", "success");
              form.reset();
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalBtnText;
            },
            function (error) {
              clearTimeout(safetyTimer);
              showToast("Failed to send message. Please try again.", "error");
              console.error("EmailJS Error:", error);
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalBtnText;
            },
          );
        } catch (err) {
          clearTimeout(safetyTimer);
          console.error("EmailJS Sync Error:", err);
          showToast(
            "An error occurred. Please check your connection.",
            "error",
          );
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      });
    }

    function showToast(message, type) {
      if (toast) {
        toast.textContent = message;
        toast.className = `form-toast ${type}`;
        toast.style.display = "block";

        setTimeout(() => {
          toast.style.display = "none";
        }, 4000);
      }
    }
  });
</script>
